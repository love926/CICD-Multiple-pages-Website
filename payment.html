<!DOCTYPE html>
<html>
<head>
<title>Payment | Coffee House</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#f8f3ed}

header{background:#fff;padding:15px 60px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
nav{display:flex;justify-content:space-between;align-items:center}
nav a{text-decoration:none;color:#6f4e37;font-weight:600;margin:0 15px}

.pay{
max-width:450px;
margin:120px auto;
background:#fff;
padding:40px;
border-radius:25px;
box-shadow:0 25px 50px rgba(0,0,0,.2);
}

input{
width:100%;
padding:14px;
margin:12px 0;
border-radius:12px;
border:1px solid #ccc;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:#6f4e37;
color:#fff;
font-size:18px;
cursor:pointer;
}
</style>
</head>
<body>

<header>
<nav>
<h2>Coffee House</h2>
<div>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order</a>
</div>
</nav>
</header>

<div class="pay">
<h2>Secure Payment 🔐</h2>

<input id="card" placeholder="Card Number">
<input id="expiry" placeholder="Expiry Date">
<input id="cvv" placeholder="CVV">

<button id="payBtn">Pay Now</button>
</div>

<script>
document.getElementById("payBtn").addEventListener("click", function() {

    fetch("https://0hcps8cvi1.execute-api.us-east-1.amazonaws.com/prod/orders", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: "Coffee Customer",
            email: "customer@email.com"
        })
    })
    .then(res => res.json())
    .then(data => {
        alert("Payment Successful ☕");
        console.log(data);
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong!");
    });

});
</script>

</body>
</html>
