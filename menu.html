<!DOCTYPE html>
<html>
<head>
<title>Menu | Coffee House</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#f7efe5;color:#3e2723}

header{background:#fff;padding:15px 60px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
nav{display:flex;justify-content:space-between;align-items:center}
nav a{text-decoration:none;color:#6f4e37;font-weight:600;margin:0 15px}

h1{text-align:center;margin:40px 0}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:35px;
padding:0 70px 80px;
}

.card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,.15);
transition:.4s;
}
.card:hover{transform:translateY(-10px)}

.card img{width:100%;height:220px;object-fit:cover}
.card h3{text-align:center;margin-top:15px}
.card p{text-align:center;padding:10px 20px;font-size:14px}

.btn{
display:block;
margin:15px auto 25px;
background:#6f4e37;
color:#fff;
padding:10px 25px;
border-radius:30px;
text-decoration:none;
width:max-content;
}
</style>
</head>
<body>

<header>
<nav>
<h2>Coffee House</h2>
<div>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order</a>
<a href="login.html">Login</a>
<a href="contact.html">Contact</a>
</div>
</nav>
</header>

<h1>Our Coffee Menu ☕</h1>

<section class="menu">
<div class="card">
<img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=800&q=80">
<h3>Espresso</h3>
<p>Strong shot with rich aroma and bold taste.</p>
<a href="order.html" class="btn">Order Now</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?auto=format&fit=crop&w=800&q=80">
<h3>Cappuccino</h3>
<p>Perfect blend of milk foam and espresso.</p>
<a href="order.html" class="btn">Order Now</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=800&q=80">
<h3>Latte</h3>
<p>Smooth, creamy and comforting coffee.</p>
<a href="order.html" class="btn">Order Now</a>
</div>
</section>

</body>
</html>
